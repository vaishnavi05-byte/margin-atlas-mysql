name: Analytical regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - run: python scripts/reproduce.py
      - run: pip install 'pandas>=2.2,<4'
      - run: python scripts/analyze_independently.py
